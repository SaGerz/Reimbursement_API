services:
  mysql:
    image: mysql:8.0
    container_name: mysql-reimburstment
  
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reimbursement_db

    ports:
      - "3306:3306"
    
    volumes:
      - mysql_data:/var/lib/mysql

    
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s


  api:
    build: 
      context: .
    
    container_name: reimbursement-api
    
    ports:
      - "5279:8080"
    
    depends_on:
      mysql: 
        condition: service_healthy

    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIROMENT: Development
      ConnectionStrings__DefaultConnection: "server=mysql;port=3306;database=reimbursement_db;user=root;password=root;"
    

volumes:
  mysql_data: