services:
  mysql:
    image: mysql:8.0
    container_name: mysql-reimburstment
  
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYYSQL_DATABASE: reimburstment_db

    ports:
      - "3306:3306"
    
    volumes:
      - mysql_data:/var/lib/mysql
  
  api:
    build: 
      context: .
    
    container_name: reimbursement-api
    
    ports:
      - "5279:8080"
    
    depends_on:
      - mysql

    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "server=mysql;port=3306;database=reimbursement_db;user=root;password=root;"
    

volumes:
  mysql_data: